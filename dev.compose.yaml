services:

  postgres:
    image: postgres:18.3-trixie
    container_name: dp-docs-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5434"
    volumes:
      - pg:/var/lib/postgresql/data/pgdata
    networks:
      - dp_docs_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dp-docs-backend
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - storage:/backend/data/storage
    environment:
      - PATH_TO_STORAGE=/backend/data/storage
      - POSTGRES_HOST=postgres
    env_file:
      - .env
    networks:
      - dp_docs_network
    ports:
      - "49558:49558"
    depends_on:
      postgres:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:49558/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # frontend:
